                    const gen = m.generation || '未知';
                    if (!groups[gen]) groups[gen] = [];
                    groups[gen].push(m);
                });
                return groups;
            }
            function getMemberById(id) {
                return members.find(m => m.id === id);
            }
            function normalizeUrl(url) {
                if (!url) return '#';
                if (/^(https?:)?\/\//i.test(url) || /^(mailto|tel):/i.test(url)) return url;
                return 'https://' + url;
            }

            /* ============================================================
               前台渲染
               ============================================================ */
            async function loadMembers() {
                timelineEl.innerHTML = '<div class="state-box"><div class="spinner"></div><p>正在加载成员数据…</p></div>';
                countBadge.textContent = '…';
                try {
                    members = await apiFetch('/members');
                    renderFilters();
                    renderTimeline();
                } catch (err) {
                    members = [];
                    countBadge.textContent = '—';
                    timelineEl.innerHTML =
                        '<div class="state-box"><p>成员数据加载失败：' + esc(err.message) + '</p>' +
                        '<button class="reset-btn" id="retryLoadBtn">重新加载</button></div>';
                    const btn = $('retryLoadBtn');
                    if (btn) btn.addEventListener('click', loadMembers);
                }
            }

            function renderFilters() {
                const tags = getAllTags();
                const filterList = ['全部', ...tags];
                let html = '';
                filterList.forEach(label => {
                    const activeClass = label === activeFilter ? 'active' : '';
                    html += '<button class="filter-btn ' + activeClass + '" data-filter="' + esc(label) + '">' + esc(label) + '</button>';
                });
                filterBarEl.innerHTML = html;
                filterBarEl.querySelectorAll('.filter-btn').forEach(btn => {
                    btn.addEventListener('click', function () {
                        if (isExpanded) closeExpand();
                        activeFilter = this.dataset.filter;
                        renderFilters();
                        renderTimeline();
                    });
                });
            }

            function renderTimeline() {
                if (!members.length) {
                    countBadge.textContent = '0 位成员';
                    timelineEl.innerHTML = '<div class="empty-state"><p>暂无成员数据</p></div>';
                    return;
                }
                let filtered = members;
                if (activeFilter !== '全部') {
                    filtered = members.filter(m => (m.tags || []).includes(activeFilter));
                }
                countBadge.textContent = filtered.length + ' 位成员';
                const groups = groupByGeneration(filtered);
                const generations = Object.keys(groups).sort((a, b) => b.localeCompare(a));
                if (generations.length === 0) {
                    timelineEl.innerHTML = '<div class="empty-state"><p>✧ 没有成员匹配 “' + esc(activeFilter) + '” 标签</p></div>';
                    return;
                }
                let html = '';
                generations.forEach(gen => {
                    const list = groups[gen];
                    let cardsHtml = '';
                    list.forEach(m => {
                        const avatarContent = m.avatar
                            ? '<img src="' + esc(m.avatar) + '" alt="' + esc(m.name) + '" loading="lazy" />'
                            : esc(String(m.name || '?').charAt(0));
                        cardsHtml +=
                            '<div class="card-thumb" data-id="' + m.id + '">' +
                            '<div class="thumb-avatar">' + avatarContent + '</div>' +
                            '<div class="thumb-name">' + esc(m.name) + '</div>' +
                            '</div>';
                    });
                    html +=
                        '<div class="timeline-item" data-generation="' + esc(gen) + '">' +
                        '<div class="generation-header">' +
                        '<span class="generation-title">' + esc(gen) + ' 届</span>' +
                        '<span class="generation-count">' + list.length + ' 人</span>' +
                        '</div>' +
                        '<div class="card-grid">' + cardsHtml + '</div>' +
                        '</div>';
                });
                timelineEl.innerHTML = html;
                timelineEl.querySelectorAll('.card-thumb').forEach(el => {
                    el.addEventListener('click', function () {
                        const id = parseInt(this.dataset.id, 10);
                        if (isExpanded && currentMemberId === id) { closeExpand(); return; }
                        openExpand(id, this);
                    });
                });
            }

            function fillExpandCard(member) {
                const avatarContent = member.avatar
                    ? '<img src="' + esc(member.avatar) + '" alt="' + esc(member.name) + '" />'
                    : esc(String(member.name || '?').charAt(0));
                expandAvatar.innerHTML = avatarContent;
                expandName.textContent = member.name;
                expandRole.textContent = member.role || '成员';
                expandBio.textContent = member.bio || '这位成员很神秘，什么都没有留下。';

                expandTags.innerHTML = '';
                if (member.tags && member.tags.length) {
                    member.tags.forEach(tag => {
                        const span = document.createElement('span');
                        span.className = 'tag';
                        span.textContent = tag;
                        expandTags.appendChild(span);
                    });
                } else {
                    expandTags.innerHTML = '<span style="color:#9aa6b5;font-size:13px;">暂无标签</span>';
                }

                expandSocial.innerHTML = '';
                const socials = Array.isArray(member.social) ? member.social.filter(s => s && (s.name || s.url)) : [];
                if (socials.length) {
                    socials.forEach(s => {
                        const a = document.createElement('a');
                        a.className = 'social-link';
                        a.textContent = s.name || s.url;
                        a.href = normalizeUrl(s.url);
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        expandSocial.appendChild(a);
                    });
                } else {
                    const span = document.createElement('span');
                    span.className = 'social-empty';
                    span.textContent = '暂无社交链接';
                    expandSocial.appendChild(span);
                }
            }

            /* ============================================================
               展开卡片动画
               ============================================================ */
            function openExpand(id, thumbEl) {
                if (expandAnimating) return;
                const member = getMemberById(id);
                if (!member) return;

                if (isExpanded) {
                    if (currentMemberId === id) { closeExpand(); return; }
                    closeExpand(() => openExpand(id, thumbEl));
                    return;
                }

                const seq = ++animSeq;
                currentMemberId = id;
                expandAnimating = true;
                fillExpandCard(member);

                const start = thumbEl.getBoundingClientRect();
                const padTop = getCollapsedPadTop(thumbEl, start);

                expandCard.style.transition = 'none';
                expandContent.style.transition = 'none';
                expandCard.classList.remove('show');
                expandCard.style.setProperty('--pad-top', padTop + 'px');
                setCardRect(start);
                expandCard.style.overflow = 'hidden';
                expandCard.style.pointerEvents = 'none';
                expandCard.style.visibility = 'visible';

                thumbEl.classList.add('expanded');
                overlay.classList.add('active');
                lockScroll();

                void expandCard.offsetHeight;
                expandCard.style.transition = '';
                expandContent.style.transition = '';

                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        if (seq !== animSeq) return;
                        setCardRect(computeTargetRect());
                        expandCard.classList.add('show');
                    });
                });

                isExpanded = true;
                expandCard._thumbEl = thumbEl;
                expandCard._thumbRect = { left: start.left, top: start.top, width: start.width, height: start.height };

                clearTimeout(animTimer);
                animTimer = setTimeout(() => {
                    if (seq !== animSeq) return;
                    expandCard.style.pointerEvents = 'auto';
                    expandCard.style.overflow = '';
                    expandAnimating = false;
                }, ANIM_WAIT);
            }

            function closeExpand(onDone) {
                if (!isExpanded || expandAnimating) return;
                const seq = ++animSeq;
                expandAnimating = true;

                let targetThumb = expandCard._thumbEl;
                if (!targetThumb || !document.contains(targetThumb)) {
                    targetThumb = document.querySelector('.card-thumb[data-id="' + currentMemberId + '"]');
                }
                let targetRect, padTop = 26;
                if (targetThumb && document.contains(targetThumb)) {
                    const r = targetThumb.getBoundingClientRect();
                    targetRect = { left: r.left, top: r.top, width: r.width, height: r.height };
                    padTop = getCollapsedPadTop(targetThumb, r);
                } else {
                    targetRect = expandCard._thumbRect || computeTargetRect();
                }

                expandCard.style.setProperty('--pad-top', padTop + 'px');
                expandCard.classList.remove('show');
                expandCard.style.pointerEvents = 'none';
                expandCard.style.overflow = 'hidden';
                setCardRect(targetRect);
                overlay.classList.remove('active');

                clearTimeout(animTimer);
                animTimer = setTimeout(() => {
                    if (seq !== animSeq) return;
                    unlockScroll();
                    isExpanded = false;
                    currentMemberId = null;
                    if (targetThumb && document.contains(targetThumb)) {
                        targetThumb.classList.remove('expanded');
                    }
                    expandCard.style.visibility = 'hidden';
                    expandCard.style.pointerEvents = '';
                    expandCard.style.overflow = '';
                    expandCard._thumbEl = null;
                    expandAnimating = false;
                    if (typeof onDone === 'function') onDone();
                }, ANIM_WAIT);
            }

            function forceCollapse() {
                animSeq++;
                clearTimeout(animTimer);
                overlay.classList.remove('active');
                if (expandCard._thumbEl && document.contains(expandCard._thumbEl)) {
                    expandCard._thumbEl.classList.remove('expanded');
                }
                expandCard.classList.remove('show');
                expandCard.style.visibility = 'hidden';
                expandCard.style.pointerEvents = '';
                expandCard.style.overflow = '';
                expandCard._thumbEl = null;
                if (isExpanded) unlockScroll();
                isExpanded = false;
                currentMemberId = null;
                expandAnimating = false;
            }

            let viewportTimer = null;
            function scheduleReposition() {
                if (!isExpanded || expandAnimating) return;
                clearTimeout(viewportTimer);
                viewportTimer = setTimeout(() => {
                    if (!isExpanded || expandAnimating) return;
                    setCardRect(computeTargetRect());
                }, 150);
            }
            window.addEventListener('resize', scheduleReposition);
            window.addEventListener('orientationchange', scheduleReposition);
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', scheduleReposition);
            }

            /* ============================================================
               共享：社交链接动态行
               ============================================================ */
            function addSocialRowTo(container, name, url) {
                const row = document.createElement('div');
                row.className = 'social-row';
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.placeholder = '名称（如 哔哩哔哩）';
                nameInput.value = name;
                const urlInput = document.createElement('input');
                urlInput.type = 'text';
                urlInput.placeholder = 'https://…';
                urlInput.value = url;
                const del = document.createElement('button');
                del.type = 'button';
                del.className = 'sr-del';
                del.textContent = '✕';
                del.addEventListener('click', () => row.remove());
                row.appendChild(nameInput);
                row.appendChild(urlInput);
                row.appendChild(del);
                container.appendChild(row);
            }

            /* ============================================================
               前台 · 编辑资料模态（走审核）
               ============================================================ */
            function openEditModal(targetMemberId) {
                editCtx = { targetMemberId: targetMemberId || null, memberId: null, verifyToken: null, original: null };
                editStepVerify.hidden = false;
                editStepForm.hidden = true;
                verifyError.textContent = '';
                verifySubmitBtn.disabled = false;
                verifySubmitBtn.textContent = '验 证';
                editModal.classList.add('active');
                lockScroll();
                editModalOpen = true;
                setTimeout(() => verifyNameInput.focus(), 120);
            }

            function closeEditModal() {
                if (!editModalOpen) return;
                editModal.classList.remove('active');
                unlockScroll();
                editModalOpen = false;
            }

            async function handleVerifySubmit() {
                const realName = verifyNameInput.value.trim();
                verifyError.textContent = '';
                if (!realName) { verifyError.textContent = '请输入真实姓名'; return; }

                verifySubmitBtn.disabled = true;
                verifySubmitBtn.textContent = '验证中…';
                try {
                    const data = await apiFetch('/verify-name', {
                        method: 'POST',
                        body: { realName, memberId: editCtx.targetMemberId || undefined }
                    });
                    editCtx.memberId = data.memberId;
                    editCtx.verifyToken = data.verifyToken;
                    editCtx.original = data.member;
                    editTargetName.textContent = data.member.name;
                    fillEditForm(data.member);
                    editStepVerify.hidden = true;
                    editStepForm.hidden = false;
                } catch (err) {
                    verifyError.textContent = err.message;
                } finally {
                    verifySubmitBtn.disabled = false;
                    verifySubmitBtn.textContent = '验 证';
                }
            }

            function fillEditForm(member) {
                efName.value = member.name || '';
                efGeneration.value = member.generation || '';
                efRole.value = member.role || '';
                efAvatar.value = member.avatar || '';
                efBio.value = member.bio || '';
                efTags.value = (member.tags || []).join(', ');
                efSocialRows.innerHTML = '';
                const socials = Array.isArray(member.social) ? member.social : [];
                socials.forEach(s => addSocialRowTo(efSocialRows, s.name || '', s.url || ''));
                editSubmitError.textContent = '';
            }

            function collectFormValues() {
                const social = [];
                efSocialRows.querySelectorAll('.social-row').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    const n = inputs[0].value.trim();
                    const u = inputs[1].value.trim();
                    if (n || u) social.push({ name: n, url: u });
                });
                const tags = efTags.value.split(/[,，、\s]+/).map(t => t.trim()).filter(Boolean);
                return {
                    name: efName.value.trim(),
                    generation: efGeneration.value.trim(),
                    role: efRole.value.trim(),
                    bio: efBio.value.trim(),
                    avatar: efAvatar.value.trim(),
                    tags,
                    social
                };
            }

            function buildChanges() {
                const vals = collectFormValues();
                const o = editCtx.original || {};
                const changes = {};
                ['name', 'generation', 'role', 'bio', 'avatar'].forEach(k => {
                    if (vals[k] !== (o[k] || '')) changes[k] = vals[k];
                });
                if (vals.tags.join('\u0001') !== (o.tags || []).join('\u0001')) changes.tags = vals.tags;
                const normSocial = arr => (arr || []).map(s => s.name + '\u0001' + s.url).join('\u0002');
                if (normSocial(vals.social) !== normSocial(o.social)) changes.social = vals.social;
                return changes;
            }

            async function handleEditSubmit() {
                const changes = buildChanges();
                editSubmitError.textContent = '';
                if (!Object.keys(changes).length) {
                    editSubmitError.textContent = '没有修改任何内容';
                    return;
                }
                editSubmitBtn.disabled = true;
                editSubmitBtn.textContent = '提交中…';
                try {
                    await apiFetch('/submissions', {
                        method: 'POST',
                        body: { verifyToken: editCtx.verifyToken, changes }
                    });
                    closeEditModal();
                    toast('已提交审核，请等待管理员处理', 'success');
                } catch (err) {
                    editSubmitError.textContent = err.message;
                    if (err.code === 'TOKEN_INVALID' || err.code === 'TOKEN_EXPIRED') {
                        editStepForm.hidden = true;
                        editStepVerify.hidden = false;
                        verifyError.textContent = err.message;
                    }
                } finally {
                    editSubmitBtn.disabled = false;
                    editSubmitBtn.textContent = '提交审核';
                }
            }

            /* ============================================================
               后台 · 成员管理模态（立即生效）
               ============================================================ */
            function openMemberModal(mode, member) {
                memberModalMode = mode;
                memberModalEditId = member ? member.id : null;
                memberModalTitle.textContent = mode === 'add' ? '添加成员' : '编辑成员';

                // ★ 只进不出字段：编辑时无法回显，永远从空开始
                mfRealName.value = '';
                if (mode === 'add') {
                    memberModalTip.innerHTML = '添加后<b>立即生效</b>（管理员操作无需审核）。真实姓名仅存储哈希值，用于成员自助修改资料时的身份验证。';
                    mfRealName.placeholder = '如：张三';
                    mfRealNameHint.textContent = '只进不出：服务端只存哈希，任何接口（含后台）都不会返回该值';
                } else {
                    memberModalTip.innerHTML = '正在编辑 <b>' + esc(member.name) + '</b>（#' + member.id + '），保存后<b>立即生效</b>。';
                    mfRealName.placeholder = '留空表示不修改';
                    mfRealNameHint.textContent = '已登记的真实姓名无法查看；留空保持不变，填写则覆盖';
                }

                mfName.value = member ? (member.name || '') : '';
                mfGeneration.value = member ? (member.generation || '') : '';
                mfRole.value = member ? (member.role || '') : '';
                mfAvatar.value = member ? (member.avatar || '') : '';
                mfBio.value = member ? (member.bio || '') : '';
                mfTags.value = member ? (member.tags || []).join(', ') : '';
                mfSocialRows.innerHTML = '';
                if (member && Array.isArray(member.social)) {
                    member.social.forEach(s => addSocialRowTo(mfSocialRows, s.name || '', s.url || ''));
                }
                memberFormError.textContent = '';
                memberModal.classList.add('active');
                lockScroll();
                memberModalOpen = true;
                setTimeout(() => mfRealName.focus(), 120);
            }

            function closeMemberModal() {
                if (!memberModalOpen) return;
                memberModal.classList.remove('active');
                unlockScroll();
                memberModalOpen = false;
            }

            function collectAdminFormValues() {
                const social = [];
                mfSocialRows.querySelectorAll('.social-row').forEach(row => {
                    const inputs = row.querySelectorAll('input');
                    const n = inputs[0].value.trim();
                    const u = inputs[1].value.trim();
                    if (n || u) social.push({ name: n, url: u });
                });
                const tags = mfTags.value.split(/[,，、\s]+/).map(t => t.trim()).filter(Boolean);
                return {
                    realName: mfRealName.value.trim(),
                    name: mfName.value.trim(),
                    generation: mfGeneration.value.trim(),
                    role: mfRole.value.trim(),
                    avatar: mfAvatar.value.trim(),
                    bio: mfBio.value.trim(),
                    tags,
                    social
                };
            }

            async function handleMemberSave() {
                const vals = collectAdminFormValues();
                memberFormError.textContent = '';
                if (memberModalMode === 'add' && !vals.realName) {
                    memberFormError.textContent = '真实姓名不能为空';
                    return;
                }
                if (!vals.name) { memberFormError.textContent = '昵称不能为空'; return; }
                if (!vals.generation) { memberFormError.textContent = '届不能为空'; return; }

                memberSaveBtn.disabled = true;
                memberSaveBtn.textContent = '保存中…';
                try {
                    if (memberModalMode === 'add') {
                        await apiFetch('/admin/members', { method: 'POST', body: vals, token: adminToken });
                        toast('成员已添加', 'success');
                    } else {
                        // ★ 编辑时留空 = 不修改 realName（不发送该字段）
                        const body = { ...vals };
                        if (!body.realName) delete body.realName;
                        await apiFetch('/admin/members/' + memberModalEditId, { method: 'PUT', body, token: adminToken });
                        toast('修改已保存', 'success');
                    }
                    closeMemberModal();
                    mainNeedsReload = true;
                    loadAdminMembers();
                } catch (err) {
                    memberFormError.textContent = err.message;
                    if (isAuthErr(err)) {
                        adminLogout(true);
                        toast(err.message, 'error');
                        closeMemberModal();
                    }
                } finally {
                    memberSaveBtn.disabled = false;
                    memberSaveBtn.textContent = '保 存';
                }
            }

            /* ============================================================
               后台 · 审核 / 成员管理渲染
               ============================================================ */
            const FIELD_LABELS = {
                name: '昵称', generation: '届', role: '职位',
                bio: '简介', tags: '标签', social: '社交链接', avatar: '头像'
            };
            function formatVal(k, v) {
                if (v == null || v === '') return '（空）';
                if (k === 'tags') return (v || []).join('、');
                if (k === 'social') return (v || []).map(s => s.name + ': ' + s.url).join('\n');
                return String(v);
            }
            function isAuthErr(err) {
                return err && (err.status === 401 || /TOKEN|PASSWORD/i.test(err.code || ''));
            }

            function renderAdmin() {
                const logged = !!adminToken;
                adminLoginView.hidden = logged;
                adminPanelView.hidden = !logged;
                if (logged) loadAdminList();
            }

            async function doAdminLogin() {
                const pw = adminPasswordInput.value;
                adminLoginError.textContent = '';
                if (!pw) { adminLoginError.textContent = '请输入密码'; return; }
                adminLoginBtn.disabled = true;
                adminLoginBtn.textContent = '验证中…';
                try {
                    const data = await apiFetch('/admin/login', { method: 'POST', body: { password: pw } });
                    adminToken = data.adminToken;
                    sessionStorage.setItem('adminToken', adminToken);
                    adminPasswordInput.value = '';
                    renderAdmin();
                } catch (err) {
                    adminLoginError.textContent = err.message;
                } finally {
                    adminLoginBtn.disabled = false;
                    adminLoginBtn.textContent = '进入后台';
                }
            }

            function adminLogout(silent) {
                adminToken = null;
                sessionStorage.removeItem('adminToken');
                if (!silent) toast('已退出后台');
                renderAdmin();
            }

            async function loadAdminList() {
                if (adminTab === 'members') return loadAdminMembers();
                adminListEl.innerHTML = '<div class="state-box"><div class="spinner"></div><p>加载中…</p></div>';
                try {
                    const list = await apiFetch('/admin/submissions?status=' + adminTab, { token: adminToken });
                    renderSubmissionList(list);
                } catch (err) {
                    if (isAuthErr(err)) {
                        adminLogout(true);
                        toast(err.message, 'error');
                        return;
                    }
                    adminListEl.innerHTML = '<div class="state-box"><p>' + esc(err.message) + '</p></div>';
                }
            }

            function renderSubmissionList(list) {
                if (!list.length) {
                    const tips = { pending: '暂无待审核的提交', approved: '暂无已通过的记录', rejected: '暂无已驳回的记录' };
                    adminListEl.innerHTML = '<div class="empty-state"><p>' + tips[adminTab] + '</p></div>';
                    return;
                }
                adminListEl.innerHTML = list.map(sub => {
                    const rows = Object.keys(sub.changes).map(k =>
                        '<tr>' +
                        '<td>' + esc(FIELD_LABELS[k] || k) + '</td>' +
                        '<td class="diff-old">' + esc(formatVal(k, sub.oldData ? sub.oldData[k] : undefined)) + '</td>' +
                        '<td class="diff-new">' + esc(formatVal(k, sub.changes[k])) + '</td>' +
                        '</tr>'
                    ).join('');

                    const reasonHtml = (sub.status === 'rejected' && sub.reason)
                        ? '<div class="sub-reason">驳回理由：' + esc(sub.reason) + '</div>'
                        : '';

                    let actionsHtml;
                    if (sub.status === 'pending') {
                        actionsHtml =
                            '<div class="sub-actions">' +
                            '<button class="btn-approve" data-action="approve">✓ 通过</button>' +
                            '<button class="btn-reject" data-action="show-reject">✕ 驳回</button>' +
                            '</div>' +
                            '<div class="rej-box" hidden>' +
                            '<input type="text" class="rej-input" placeholder="驳回理由（必填）" />' +
                            '<button class="btn-reject" data-action="reject">确认驳回</button>' +
                            '<button class="btn-ghost" data-action="cancel-reject">取消</button>' +
                            '</div>';
                    } else {
                        actionsHtml = '<div class="sub-actions"><span class="badge-status st-' + sub.status + '">' +
                            (sub.status === 'approved' ? '已通过' : '已驳回') +
                            '</span><span style="font-size:12px;color:#9aa6b5;">' + esc(fmtTime(sub.reviewedAt)) + '</span></div>';
                    }

                    // ★ 不显示提交人真实姓名（只进不出），
                    //   以「已实名验证」徽章代替
                    return '<div class="sub-card" data-sub-id="' + sub.id + '">' +
                        '<div class="sub-meta">' +
                        '<span>目标成员：<b>' + esc(sub.memberName) + '</b>（ID ' + sub.memberId + '）</span>' +
                        '<span>提交时间：' + esc(fmtTime(sub.createdAt)) + '</span>' +
                        (sub.verifiedByRealName ? '<span class="verify-chip">✓ 已实名验证</span>' : '') +
                        '</div>' +
                        '<table class="diff-table">' +
                        '<thead><tr><th style="width:80px">字段</th><th>当前值</th><th>修改为</th></tr></thead>' +
                        '<tbody>' + rows + '</tbody>' +
                        '</table>' +
                        reasonHtml +
                        actionsHtml +
                        '</div>';
                }).join('');
            }

            /* ===== 后台 · 成员管理列表 ===== */
            async function loadAdminMembers() {
                adminListEl.innerHTML = '<div class="state-box"><div class="spinner"></div><p>加载中…</p></div>';
                try {
                    adminMembersCache = await apiFetch('/admin/members', { token: adminToken });
                    renderAdminMembers(adminMembersCache);
                } catch (err) {
                    if (isAuthErr(err)) {
                        adminLogout(true);
                        toast(err.message, 'error');
                        return;
                    }
                    adminMembersCache = [];
                    adminListEl.innerHTML = '<div class="state-box"><p>' + esc(err.message) + '</p></div>';
                }
            }

            function renderAdminMembers(list) {
                const sorted = list.slice().sort((a, b) =>
                    String(b.generation || '').localeCompare(String(a.generation || '')) || (a.id - b.id)
                );
                let html = '<div class="ma-toolbar">' +
                    '<span class="ma-count">共 ' + list.length + ' 位成员</span>' +
                    '<button class="btn-primary" data-action="m-add">＋ 添加成员</button>' +
                    '</div>';
                if (!list.length) {
                    html += '<div class="empty-state"><p>暂无成员，点击右上角「添加成员」创建</p></div>';
                } else {
                    sorted.forEach(m => {
                        const avatarContent = m.avatar
                            ? '<img src="' + esc(m.avatar) + '" alt="" loading="lazy" />'
                            : esc(String(m.name || '?').charAt(0));
                        html +=
                            '<div class="member-admin-card" data-member-id="' + m.id + '">' +
                            '<div class="ma-avatar">' + avatarContent + '</div>' +
                            '<div class="ma-info">' +
                            '<div class="ma-name">' + esc(m.name) + '<span class="ma-id">#' + m.id + '</span></div>' +
                            '<div class="ma-sub">' + esc(m.generation) + ' 届 · ' + esc(m.role || '未设置职位') + '</div>' +
                            '</div>' +
                            '<div class="ma-actions">' +
                            '<button class="btn-ghost" data-action="m-edit" data-id="' + m.id + '">编辑</button>' +
                            '<button class="btn-reject" data-action="m-del" data-id="' + m.id + '">删除</button>' +
                            '</div>' +
                            '<div class="ma-del-box" hidden>' +
                            '<span class="ma-del-text">确定删除 <b>' + esc(m.name) + '</b> ？此操作不可恢复，其待审核提交将自动作废。</span>' +
                            '<button class="btn-reject" data-action="m-del-confirm" data-id="' + m.id + '">确认删除</button>' +
                            '<button class="btn-ghost" data-action="m-del-cancel">取消</button>' +
                            '</div>' +
                            '</div>';
                    });
                }
                adminListEl.innerHTML = html;
            }

            async function handleMemberDelete(id) {
                try {
                    await apiFetch('/admin/members/' + id, { method: 'DELETE', token: adminToken });
                    toast('成员已删除', 'success');
                    mainNeedsReload = true;
                    loadAdminMembers();
                } catch (err) {
                    if (isAuthErr(err)) { adminLogout(true); toast(err.message, 'error'); return; }
                    toast(err.message, 'error');
                }
            }

            /* ============================================================
               路由
               ============================================================ */
            function route() {
                const isAdmin = location.hash === '#/admin' || location.hash === '#admin';
                viewMain.hidden = isAdmin;
                viewAdmin.hidden = !isAdmin;
                forceCollapse();
                closeEditModal();
                closeMemberModal();
                if (isAdmin) {
                    renderAdmin();
                } else if (mainNeedsReload) {
                    mainNeedsReload = false;
                    loadMembers();
                }
            }

            /* ============================================================
               事件绑定
               ============================================================ */
            resetBtn.addEventListener('click', function () {
                if (isExpanded) closeExpand();
                activeFilter = '全部';
                renderFilters();
                renderTimeline();
            });

            overlay.addEventListener('mousedown', function (e) {
                overlay._downOnSelf = (e.target === this);
            });
            overlay.addEventListener('mouseup', function (e) {
                if (overlay._downOnSelf && e.target === this) closeExpand();
            });
            overlay.addEventListener('touchmove', function (e) {
                if (e.target === this) e.preventDefault();
            }, { passive: false });

            closeBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                closeExpand();
            });

            document.addEventListener('keydown', function (e) {
                if (e.key !== 'Escape') return;
                if (memberModal.classList.contains('active')) { closeMemberModal(); return; }
                if (editModal.classList.contains('active')) { closeEditModal(); return; }
                if (isExpanded) closeExpand();
            });

            /* --- 前台编辑模态 --- */
            editOpenBtn.addEventListener('click', () => openEditModal(null));
            expandEditBtn.addEventListener('click', function (e) {
                e.stopPropagation();
                if (currentMemberId != null) openEditModal(currentMemberId);
            });
            editModal.addEventListener('mousedown', function (e) {
                editModal._downOnSelf = (e.target === this);
            });
            editModal.addEventListener('mouseup', function (e) {
                if (editModal._downOnSelf && e.target === this) closeEditModal();
            });
            editModalClose.addEventListener('click', closeEditModal);
            verifySubmitBtn.addEventListener('click', handleVerifySubmit);
            verifyNameInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') handleVerifySubmit();
            });
            efAddSocial.addEventListener('click', () => addSocialRowTo(efSocialRows, '', ''));
            editBackBtn.addEventListener('click', () => {
                editStepForm.hidden = true;
                editStepVerify.hidden = false;
                verifyError.textContent = '';
            });
            editSubmitBtn.addEventListener('click', handleEditSubmit);

            /* --- 后台成员模态 --- */
            memberModal.addEventListener('mousedown', function (e) {
                memberModal._downOnSelf = (e.target === this);
            });
            memberModal.addEventListener('mouseup', function (e) {
                if (memberModal._downOnSelf && e.target === this) closeMemberModal();
            });
            memberModalClose.addEventListener('click', closeMemberModal);
            memberCancelBtn.addEventListener('click', closeMemberModal);
            mfAddSocial.addEventListener('click', () => addSocialRowTo(mfSocialRows, '', ''));
            memberSaveBtn.addEventListener('click', handleMemberSave);

            /* --- 后台登录 --- */
            adminLoginBtn.addEventListener('click', doAdminLogin);
            adminPasswordInput.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') doAdminLogin();
            });
            adminLogoutBtn.addEventListener('click', () => adminLogout(false));

            /* --- 后台 tab 切换 --- */
            adminTabsEl.addEventListener('click', function (e) {
                const btn = e.target.closest('[data-tab]');
                if (!btn) return;
                adminTab = btn.dataset.tab;
                adminTabsEl.querySelectorAll('.filter-btn').forEach(b => b.classList.toggle('active', b === btn));
                loadAdminList();
            });

            /* --- 后台列表（审核 + 成员管理）统一事件委托 --- */
            adminListEl.addEventListener('click', async function (e) {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                const action = btn.dataset.action;

                /* 审核动作 */
                if (action === 'show-reject' || action === 'cancel-reject' || action === 'approve' || action === 'reject') {
                    const card = btn.closest('[data-sub-id]');
                    if (!card) return;
                    const id = Number(card.dataset.subId);

                    if (action === 'show-reject') {
                        const box = card.querySelector('.rej-box');
                        if (box) { box.hidden = false; box.querySelector('.rej-input').focus(); }
                    } else if (action === 'cancel-reject') {
                        const box = card.querySelector('.rej-box');
                        if (box) box.hidden = true;
                    } else if (action === 'approve') {
                        btn.disabled = true;
                        try {
                            await apiFetch('/admin/submissions/' + id + '/approve', { method: 'POST', token: adminToken });
                            toast('已通过，资料生效', 'success');
                            mainNeedsReload = true;
                            loadAdminList();
                        } catch (err) {
                            btn.disabled = false;
                            if (isAuthErr(err)) { adminLogout(true); toast(err.message, 'error'); return; }
                            toast(err.message, 'error');
                        }
                    } else if (action === 'reject') {
                        const input = card.querySelector('.rej-input');
                        const reason = input ? input.value.trim() : '';
                        if (!reason) { toast('请填写驳回理由', 'error'); return; }
                        btn.disabled = true;
                        try {
                            await apiFetch('/admin/submissions/' + id + '/reject', {
                                method: 'POST',
                                body: { reason },
                                token: adminToken
                            });
                            toast('已驳回', 'success');
                            loadAdminList();
                        } catch (err) {
                            btn.disabled = false;
                            if (isAuthErr(err)) { adminLogout(true); toast(err.message, 'error'); return; }
                            toast(err.message, 'error');
                        }
                    }
                    return;
                }

                /* 成员管理动作 */
                if (action === 'm-add') {
                    openMemberModal('add');
                } else if (action === 'm-edit') {
                    const id = Number(btn.dataset.id);
                    const m = adminMembersCache.find(x => x.id === id);
                    if (m) openMemberModal('edit', m);
                } else if (action === 'm-del') {
                    const card = btn.closest('[data-member-id]');
                    const box = card && card.querySelector('.ma-del-box');
                    if (box) box.hidden = false;
                } else if (action === 'm-del-cancel') {
                    const card = btn.closest('[data-member-id]');
                    const box = card && card.querySelector('.ma-del-box');
                    if (box) box.hidden = true;
                } else if (action === 'm-del-confirm') {
                    const id = Number(btn.dataset.id);
                    btn.disabled = true;
                    await handleMemberDelete(id);
                }
            });

            /* ============================================================
               主题切换
               ============================================================ */
            const themeSwitchEls = document.querySelectorAll('.theme-switch');
            const themeMedia = window.matchMedia('(prefers-color-scheme: dark)');
            const THEME_KEY = 'themeMode';

            function getThemeMode() {
                try { return localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) { return 'auto'; }
            }

            function applyTheme(mode) {
                const isDark = mode === 'dark' || (mode === 'auto' && themeMedia.matches);
                document.documentElement.dataset.theme = isDark ? 'dark' : 'light';
                document.documentElement.dataset.themeMode = mode;
                themeSwitchEls.forEach(el => {
                    el.querySelectorAll('button').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.themeMode === mode);
                    });
                });
            }

            themeSwitchEls.forEach(el => {
                el.addEventListener('click', function (e) {
                    const btn = e.target.closest('[data-theme-mode]');
                    if (!btn) return;
                    const mode = btn.dataset.themeMode;
                    try { localStorage.setItem(THEME_KEY, mode); } catch (err) { /* 忽略 */ }
                    applyTheme(mode);
                });
            });

            if (themeMedia.addEventListener) {
                themeMedia.addEventListener('change', function () {
                    if (getThemeMode() === 'auto') applyTheme('auto');
                });
            } else if (themeMedia.addListener) {
                themeMedia.addListener(function () {
                    if (getThemeMode() === 'auto') applyTheme('auto');
                });
            }

            applyTheme(getThemeMode());

            /* ============================================================
               初始化
               ============================================================ */
            window.addEventListener('hashchange', route);
            route();
            loadMembers();

            window.__members = () => members;
        })();
    </script>
</body>

</html>
